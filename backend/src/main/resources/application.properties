spring.application.name=backend
gemini.api.key=${GEMINI_API_KEY:}
guardian.api.key=${GUARDIAN_API_KEY:}

## Development: use in-memory H2 to avoid external DB during local testing
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# Let JPA create/update schema for dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in local dev to avoid external DB migration failures
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
logging.level.org.springframework.security=DEBUG
