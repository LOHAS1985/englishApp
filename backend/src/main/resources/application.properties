spring.application.name=backend
# プロファイル未指定時はローカル開発用(dev)で起動する。本番は SPRING_PROFILES_ACTIVE=prod を設定する
spring.profiles.default=dev

gemini.api.key=${GEMINI_API_KEY:}
guardian.api.key=${GUARDIAN_API_KEY:}
deepl.auth-key=${DEEPL_AUTH_KEY:}
deepl.api-url=${DEEPL_API_URL:https://api-free.deepl.com/v2/translate}

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Flyway: 既存DB(Hibernateがテーブルを作成済みで履歴なし)は V4 を基準に V5 以降だけ適用する
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

## Expose actuator health endpoint to web for frontend checks
management.endpoints.web.exposure.include=health,info
## Expose actuator endpoints at root so frontend can call /health
management.endpoints.web.base-path=/
management.endpoint.health.show-details=never
