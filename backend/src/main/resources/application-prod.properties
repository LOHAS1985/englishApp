## Production profile overrides
# 本番DBは環境変数 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD で指定する。
# 未設定時のみ下記のインメモリH2で起動する(再起動で記録が消えるため、起動時にエラーログを出す)
spring.datasource.url=jdbc:h2:mem:proddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL

# スキーマは Flyway マイグレーションだけで管理する
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# 無料の外部DB(Neon など)は使っていない間は止まり、稼働時間で無料枠を消費する。
# 起動維持の ping(/health、14分ごと)で DB を起こさないよう、ヘルスチェックから DB を外す
management.health.db.enabled=false
# 使っていない接続を開けたままにすると DB が止まらないので、待機中の接続は持たず1分で閉じる
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
