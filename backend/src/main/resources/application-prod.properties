## Production profile overrides
# 本番DBは環境変数 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD で指定する。
# 未設定時のみ下記のインメモリH2で起動する(再起動で記録が消えるため、起動時にエラーログを出す)
spring.datasource.url=jdbc:h2:mem:proddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL

# スキーマは Flyway マイグレーションだけで管理する
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
