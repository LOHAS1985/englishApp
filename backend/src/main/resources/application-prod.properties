## Production profile overrides
# 本番DBは環境変数 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD で指定する。
# 未設定時のみ下記のインメモリH2で起動する(再起動で記録が消えるため、起動時にエラーログを出す)
spring.datasource.url=jdbc:h2:mem:proddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL

# 本番で DB の接続先・端末登録の合言葉(APP_ACCESS_KEY)が未設定なら、起動を失敗させる(ProductionConfigGuard)。
# 黙ってメモリ内の DB で動いて記録が消えたり、API がだれでも使える状態になったりするのを防ぐ。
# 本番プロファイルでのテスト・Docker のビルド時の起動(AOT キャッシュ作成)は、設定が無いので APP_STRICT_CONFIG=false で切る
app.strict-config=${APP_STRICT_CONFIG:true}

# スキーマは Flyway マイグレーションだけで管理する
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# 無料の外部DB(Neon など)は使っていない間は止まり、稼働時間で無料枠を消費する。
# 起動維持の ping(/health、14分ごと)で DB を起こさないよう、ヘルスチェックから DB を外す
management.health.db.enabled=false
# 使っていない接続を開けたままにすると DB が止まらないので、待機中の接続は持たず1分で閉じる
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Render 無料プラン(CPU 0.1)では起動に数分かかるため、Bean は必要になったときに作る。
# 問題は画面に同梱した問題集から出すので、最初の API 呼び出しが少し遅くなっても表示は待たされない
spring.main.lazy-initialization=true

# 起動後に、ホーム画面が最初に呼ぶ API を先に呼んで部品を温める(WarmUp)。遅延初期化の最初の呼び出しの遅さを、画面を開かれる前に済ませる。
# 外部 DB にも接続するので、不要なら環境変数 APP_WARMUP=false
app.warmup=${APP_WARMUP:true}
