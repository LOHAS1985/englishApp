<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>english-app</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // ensure trailing slash for configured basename to avoid Vite dev-server message
        var base = "/englishApp";
        try {
          if (location.pathname === base) {
            var dest =
              base + "/" + (location.search || "") + (location.hash || "");
            location.replace(dest);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
