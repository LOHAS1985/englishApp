<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: load the app's index.html so the client router can handle the path
      (function() {
        try {
          fetch('./index.html')
            .then(function(r){ if (r.ok) return r.text(); throw new Error('index.html not found'); })
            .then(function(t){
              document.open();
              document.write(t);
              document.close();
            })
            .catch(function(){
              // fallback to a simple redirect to root
              location.replace('./');
            });
        } catch (e) {
          location.replace('./');
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the app… If you are not redirected, <a href="./">click here</a>.</p>
  </body>
</html>
