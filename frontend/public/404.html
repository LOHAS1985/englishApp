<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: load the app's index.html so the client router can handle the path.
      // 相対パス(./index.html)だと /englishApp/reading/article のような2階層のURLで解決先がずれるため、
      // アプリのベースパス(vite.config.ts の base と同じ)からの絶対パスで読み込む
      var BASE = '/englishApp/';
      (function() {
        try {
          fetch(BASE + 'index.html')
            .then(function(r){ if (r.ok) return r.text(); throw new Error('index.html not found'); })
            .then(function(t){
              document.open();
              document.write(t);
              document.close();
            })
            .catch(function(){
              // fallback to a simple redirect to root
              location.replace(BASE);
            });
        } catch (e) {
          location.replace(BASE);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the app… If you are not redirected, <a href="/englishApp/">click here</a>.</p>
  </body>
</html>
