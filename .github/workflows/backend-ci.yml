name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Test (dev profile)
        run: chmod +x mvnw && ./mvnw -B test
        env:
          # テストは Gemini を呼ばない(採点の計算は WritingServiceTests が確かめる)
          GEMINI_API_KEY: dummy

      - name: Test (prod profile, Flyway + schema validation)
        run: ./mvnw -B test
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          GEMINI_API_KEY: dummy
